name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Includes tests/packaging.spec.ts, which packs the package and installs
      # the tarball for real. That is the guard against shipping a file npm
      # renames or drops on install (see UPSTREAM.md).
      - name: Test
        run: npm test
